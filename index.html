<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<style>html{box-sizing:border-box}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{-webkit-tap-highlight-color:transparent}</style>
<title>1分決済タイマー</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* layout: one-screen phone tool — ring timer center, big entry/exit button at thumb height */
:root{
  --bg:#0d1117; --panel:#161c25; --line:#273142; --fg:#e8edf4; --muted:#8592a6;
  --idle:#5b8cff; --run:#2fd08a; --warn:#ffc53d; --over:#ff4d5e;
  --display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);margin:0;transition:background .25s}
body.alarm{animation:flash .5s steps(1) infinite}
@keyframes flash{0%{background:var(--over)}50%{background:var(--bg)}}
@media (prefers-reduced-motion:reduce){body.alarm{animation:none;background:#3a0d14}}
.app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:18px;padding-inline:16px;padding-block:16px;max-width:460px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:15px;font-weight:900;letter-spacing:.06em;margin:0}
.status{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.ringwrap{flex:1;display:grid;place-items:center;min-height:0}
.ring{position:relative;width:min(78vw,300px);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.track{stroke:var(--line)}
.prog{stroke:var(--idle);stroke-linecap:round;transition:stroke .2s}
.center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:4px}
.time{font-family:var(--mono);font-weight:700;font-size:64px;font-variant-numeric:tabular-nums;line-height:1}
.sub{font-size:13px;color:var(--muted)}
.presets{display:flex;gap:8px}
.presets button{flex:1;font-family:var(--mono);font-size:15px;padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
.presets button[aria-pressed="true"]{color:var(--fg);border-color:var(--idle)}
.opts{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.opts label{display:flex;align-items:center;gap:6px}
.main{font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.1em;border:0;border-radius:18px;padding:22px 0;cursor:pointer;color:#06210f;background:var(--run)}
.main.exit{background:var(--fg);color:var(--bg)}
button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.log{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;min-height:16px}
.log b{color:var(--fg);font-weight:500}
.log .late{color:var(--over)}
</style>
</head>
<body>

<div class="app">
  <header><h1>1分決済タイマー</h1><span class="status" id="status">待機中</span></header>

  <div class="ringwrap">
    <div class="ring">
      <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52"/><circle class="prog" id="prog" cx="60" cy="60" r="52"/></svg>
      <div class="center"><div class="time" id="time">1:00</div><div class="sub" id="sub">ボタンでエントリー</div></div>
    </div>
  </div>

  <div class="presets" id="presets">
    <button type="button" data-s="30" aria-pressed="false">30秒</button>
    <button type="button" data-s="45" aria-pressed="false">45秒</button>
    <button type="button" data-s="60" aria-pressed="true">60秒</button>
    <button type="button" data-s="90" aria-pressed="false">90秒</button>
  </div>
  <div class="opts">
    <label><input type="checkbox" id="snd" checked> 音</label>
    <label><input type="checkbox" id="vib" checked> 振動</label>
    <label><input type="checkbox" id="pre" checked> 残り10秒で黄色</label>
  </div>

  <button type="button" class="main" id="main">エントリー</button>
  <div class="log" id="log"><span>保有時間の記録がここに並びます</span></div>
</div>

<script>
const $=id=>document.getElementById(id);
const C=2*Math.PI*52, prog=$('prog');
prog.style.strokeDasharray=C;
let limit=60, start=0, raf=0, running=false, alarmed=false, warned=false, ac=null, beepT=0, wake=null;
const log=[];
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v);
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

function setColor(v){prog.style.stroke=css(v)}
function idle(){
  $('time').textContent=fmt(limit);prog.style.strokeDashoffset=0;setColor('--idle');
  $('sub').textContent='ボタンでエントリー';$('status').textContent='待機中';
}
function beep(f=880,d=.15){
  if(!$('snd').checked||!ac)return;
  const o=ac.createOscillator(),g=ac.createGain();
  o.frequency.value=f;o.type='square';g.gain.value=.15;
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);
}
function buzz(p){if($('vib').checked&&navigator.vibrate){try{navigator.vibrate(p)}catch(e){}}}

function tick(){
  const el=(performance.now()-start)/1000, left=limit-el;
  if(left>0){
    $('time').textContent=fmt(left);
    prog.style.strokeDashoffset=C*(el/limit);
    if($('pre').checked&&left<=10&&!warned){warned=true;setColor('--warn');$('status').textContent='まもなく';beep(660,.1);buzz(150)}
  }else{
    $('time').textContent='+'+fmt(-left);
    prog.style.strokeDashoffset=C;
    if(!alarmed){
      alarmed=true;setColor('--over');document.body.classList.add('alarm');
      $('status').textContent='時間です';$('sub').textContent='決済しましょう';
      buzz([400,150,400,150,400]);beep();
      beepT=setInterval(()=>{beep();buzz([300,150,300])},1500);
    }
  }
  raf=requestAnimationFrame(tick);
}

async function enter(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(ac&&ac.state==='suspended')ac.resume();
  try{wake=await navigator.wakeLock?.request('screen')}catch(e){}
  running=true;alarmed=false;warned=false;start=performance.now();
  setColor('--run');$('sub').textContent='保有中';$('status').textContent='保有中';
  $('main').textContent='決済した';$('main').classList.add('exit');
  beep(1200,.06);buzz(60);
  tick();
}
function exit(){
  const held=(performance.now()-start)/1000;
  cancelAnimationFrame(raf);clearInterval(beepT);running=false;
  document.body.classList.remove('alarm');
  try{wake?.release()}catch(e){};wake=null;
  log.unshift({held,late:held>limit});if(log.length>8)log.pop();
  $('log').innerHTML=log.map(x=>`<span class="${x.late?'late':''}"><b>${x.held.toFixed(1)}</b>秒</span>`).join('');
  $('main').textContent='エントリー';$('main').classList.remove('exit');
  idle();
}
$('main').onclick=()=>running?exit():enter();
$('presets').onclick=e=>{
  const b=e.target.closest('button');if(!b||running)return;
  limit=+b.dataset.s;
  document.querySelectorAll('#presets button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  idle();
};
idle();
</script>
</body>
</html>
